# /etc/nginx/sites-available/radar-fundeb
server {
    listen 80;
    server_name _;            # troque pelo seu domínio, ex.: radar.suaempresa.com.br
    client_max_body_size 60M; # importação de escolas grandes

    # Backend (API, rotas /backend/v1 e painel administrativo do PocketBase em /_/)
    location ~ ^/(api|backend|_)/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;   # processamento do município pode levar alguns segundos
        proxy_buffering off;
    }

    # Interface web
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
